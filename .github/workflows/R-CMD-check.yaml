name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast Linux prep job: generate all untracked documentation and artifacts once and
  # share them with every matrix leg. roxygenise (man/, NAMESPACE, R/globals.R)
  # is the same regardless of the check platform. Running it once on Linux and
  # downloading the result removes redundant work on macOS and Windows legs.
  prep:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup hestia CI environment
        uses: ./.github/actions/setup-hestia
        with:
          extra-packages: any::roxygen2, any::roxyglobals, any::pkgload
          needs: check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prep-build-artifacts
          if-no-files-found: error
          retention-days: 1
          path: |
            data/*.rda
            man
            NAMESPACE
            R/globals.R
            vignettes/figures/*.svg

  R-CMD-check:
    needs: prep
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: 'oldrel'}
          - {os: macos-latest,   r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel'}
          - {os: windows-latest, r: 'devel'}

    continue-on-error: ${{ matrix.config.r == 'devel' }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Restore the docs + man/ + NAMESPACE + R/globals.R produced by the
      # prep job, so this leg does not regenerate them.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: prep-build-artifacts
          path: .

      # Build steps are toggled off: the artifacts above already provide the
      # NAMESPACE, docs, and data, so this leg only needs R + the check
      # dependencies before running R CMD check.
      - name: Setup hestia CI environment
        uses: ./.github/actions/setup-hestia
        with:
          r-version: ${{ matrix.config.r }}
          extra-packages: any::rcmdcheck, any::roxygen2, any::roxyglobals, any::pkgload
          needs: check
          bootstrap-namespace: 'false'
          cache-stan: 'false'
          generate-docs: 'false'

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  check-result:
    if: always()
    needs: [prep, R-CMD-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify prep and all required checks passed
        run: |
          if [ "${{ needs.prep.result }}" != "success" ]; then
            echo "prep job did not succeed (result: ${{ needs.prep.result }})"
            exit 1
          fi
          if [ "${{ needs.R-CMD-check.result }}" != "success" ]; then
            echo "R-CMD-check did not succeed (result: ${{ needs.R-CMD-check.result }})"
            exit 1
          fi
          echo "prep and R-CMD-check both succeeded."
