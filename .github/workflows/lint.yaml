name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # lint_package() is static: it needs the sources and deps, not an installed
      # hestia or a regenerated NAMESPACE, so build steps in the composite
      # action are toggled off here (bootstrap/cache/docs).
      - name: Setup hestia CI environment
        uses: ./.github/actions/setup-hestia
        with:
          extra-packages: any::lintr
          needs: lint
          bootstrap-namespace: 'false'
          cache-stan: 'false'
          generate-docs: 'false'

      - name: Lint
        shell: bash
        run: just lint
        env:
          LINTR_ERROR_ON_LINT: true
