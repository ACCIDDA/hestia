name: data-raw-integration

# Dedicated workflow for the data-raw/*_res.R bake integration tests. These live
# under data-raw/ (build-excluded) and are NOT part of R CMD check or covr, so
# they run here on their own: load_all() compiles and attaches the package, then
# testthat::test_dir() runs the tests. HESTIA_RUN_INTEGRATION lets the two
# heavier fits (siir, sir_cov) run in CI; locally they are skipped by default.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'data-raw/**'
      - 'R/**'
      - 'inst/stan/**'
      - 'src/**'
      - '.github/workflows/data-raw-integration.yaml'

jobs:
  data-raw-integration:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      HESTIA_RUN_INTEGRATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      # The package is compiled once, by load_all() below; restore the cached
      # Stan objects before that step so a cache hit skips the recompile.
      - name: Cache Stan compilation objects
        uses: actions/cache@v5
        with:
          path: src/
          key: ${{ runner.os }}-rrelease-stan-${{ hashFiles('inst/stan/**/*.stan', 'src/**/*.stan') }}
          restore-keys: |
            ${{ runner.os }}-rrelease-stan-

      # PKG_BUILD_EXTRA_FLAGS=false stops pkgbuild from injecting -g -O0, matching
      # R-CMD-check.yaml's load_all guard.
      - name: Run data-raw bake integration tests
        env:
          PKG_BUILD_EXTRA_FLAGS: "false"
        run: |
          pkgload::load_all(".")
          testthat::test_dir("data-raw/tests")
        shell: Rscript {0}
